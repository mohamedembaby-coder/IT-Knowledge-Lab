<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic NAT pool allocation</title><desc id="desc">Multiple inside hosts receive temporary unique public addresses from a dynamic NAT pool while capacity remains available.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#536078}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#42526b}.ip{font-family:Consolas,monospace;font-size:17px;font-weight:700}.line{stroke:#0ea5e9;stroke-width:4;fill:none}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#0ea5e9"/></marker></defs>
  <rect width="1400" height="820" fill="#f8fafc"/><text x="70" y="70" class="title">Dynamic NAT | ترجمة ديناميكية من Pool</text><text x="70" y="105" class="sub">Each active inside host is assigned a unique address from a finite public pool; mappings expire when no longer needed.</text>
  <rect x="70" y="165" width="340" height="505" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="105" y="210" class="label">Inside hosts</text>
  <g fill="#fff" stroke="#38bdf8" stroke-width="2"><rect x="120" y="270" width="230" height="72" rx="10"/><rect x="120" y="385" width="230" height="72" rx="10"/><rect x="120" y="500" width="230" height="72" rx="10"/></g><text x="145" y="314" class="ip">10.10.10.21</text><text x="145" y="429" class="ip">10.10.10.22</text><text x="145" y="544" class="ip">10.10.10.23</text>
  <rect x="510" y="165" width="400" height="505" rx="20" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="545" y="210" class="label">Dynamic NAT pool | مجموعة NAT</text><rect x="555" y="255" width="310" height="260" rx="12" fill="#fff" stroke="#2dd4bf" stroke-width="2"/><text x="590" y="300" class="small">Pool: 203.0.113.100–102</text><text x="590" y="350" class="ip">.100  allocated → .21</text><text x="590" y="400" class="ip">.101  allocated → .22</text><text x="590" y="450" class="ip">.102  available</text><text x="555" y="580" class="small">Pool exhausted? A new host cannot be translated.</text><text x="555" y="608" class="small">Use PAT when address conservation is required.</text>
  <rect x="1010" y="165" width="320" height="505" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1040" y="210" class="label">Outside network</text><rect x="1060" y="355" width="220" height="105" rx="12" fill="#fff" stroke="#60a5fa" stroke-width="2"/><text x="1100" y="400" class="label">Internet services</text><text x="1100" y="430" class="small">sees pool addresses</text>
  <path d="M350 305 H555" class="line" marker-end="url(#a)"/><path d="M350 420 H555" class="line" marker-end="url(#a)"/><path d="M865 380 H1060" class="line" marker-end="url(#a)"/>
  <rect x="100" y="715" width="1200" height="55" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="130" y="750" class="small">Dynamic NAT is many-to-many over time, but each simultaneous inside host needs a unique inside-global address.</text>
</svg>
