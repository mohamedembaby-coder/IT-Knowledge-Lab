<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Packet translation flow through PAT</title><desc id="desc">A step-by-step view of an outbound packet translated at a NAT gateway and the matching inbound return translation.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#536078}.step{font-size:20px;font-weight:700}.small{font-size:16px;fill:#42526b}.pkt{font-family:Consolas,monospace;font-size:16px;font-weight:700}.arrow{stroke:#2563eb;stroke-width:5;fill:none}.return{stroke:#0f766e;stroke-width:5;fill:none;stroke-dasharray:10 7}</style><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#0f766e"/></marker></defs>
  <rect width="1400" height="850" fill="#f8fafc"/><text x="70" y="65" class="title">Packet Translation Flow | تدفق ترجمة الحزم</text><text x="70" y="100" class="sub">PAT rewrites the outbound source and tracks the flow; return traffic is matched by public IP, protocol, and translated port.</text>
  <rect x="70" y="165" width="350" height="210" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="100" y="210" class="step">1. Inside packet</text><text x="100" y="255" class="pkt">SRC 10.10.10.25:51514</text><text x="100" y="288" class="pkt">DST 198.51.100.80:443</text><text x="100" y="330" class="small">Client sends HTTPS toward the Internet.</text>
  <rect x="525" y="165" width="350" height="210" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="555" y="210" class="step">2. NAT decision + state</text><text x="555" y="255" class="pkt">10.10.10.25:51514</text><text x="555" y="288" class="pkt">↔ 203.0.113.10:30001</text><text x="555" y="330" class="small">Policy matches inside source; PAT allocates port.</text>
  <rect x="980" y="165" width="350" height="210" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1010" y="210" class="step">3. Outside packet</text><text x="1010" y="255" class="pkt">SRC 203.0.113.10:30001</text><text x="1010" y="288" class="pkt">DST 198.51.100.80:443</text><text x="1010" y="330" class="small">Internet sees the inside-global source.</text>
  <path d="M420 270 H525" class="arrow" marker-end="url(#b)"/><path d="M875 270 H980" class="arrow" marker-end="url(#b)"/>
  <rect x="980" y="500" width="350" height="185" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="1010" y="545" class="step">4. Return packet</text><text x="1010" y="590" class="pkt">SRC 198.51.100.80:443</text><text x="1010" y="623" class="pkt">DST 203.0.113.10:30001</text><text x="1010" y="655" class="small">The translated destination identifies the flow.</text>
  <rect x="525" y="500" width="350" height="185" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="555" y="545" class="step">5. Reverse translation</text><text x="555" y="590" class="pkt">DST becomes 10.10.10.25:51514</text><text x="555" y="630" class="small">State, protocol, and port must match.</text>
  <rect x="70" y="500" width="350" height="185" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="100" y="545" class="step">6. Client receives reply</text><text x="100" y="590" class="pkt">SRC 198.51.100.80:443</text><text x="100" y="623" class="pkt">DST 10.10.10.25:51514</text><text x="100" y="655" class="small">The client sees a normal end-to-end flow.</text>
  <path d="M980 590 H875" class="return" marker-end="url(#g)"/><path d="M525 590 H420" class="return" marker-end="url(#g)"/>
  <rect x="125" y="750" width="1150" height="48" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="155" y="780" class="small">Troubleshooting: inspect NAT policy, translation/state table, routing, ACL/firewall rules, and return path—not NAT alone.</text>
</svg>
