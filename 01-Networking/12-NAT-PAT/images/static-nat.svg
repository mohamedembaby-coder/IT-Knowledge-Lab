<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Static NAT one-to-one mapping</title><desc id="desc">A permanent one-to-one mapping connects an internal application server to a public IP address for inbound and outbound traffic.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#536078}.label{font-size:20px;font-weight:700}.small{font-size:16px;fill:#42526b}.ip{font-family:Consolas,monospace;font-size:20px;font-weight:700}.arrow{stroke:#7c3aed;stroke-width:5;fill:none}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#7c3aed"/></marker></defs>
  <rect width="1400" height="820" fill="#fafafa"/><text x="70" y="70" class="title">Static NAT | ترجمة ثابتة 1:1</text><text x="70" y="105" class="sub">A permanent mapping publishes one inside host through one inside-global address.</text>
  <rect x="85" y="185" width="350" height="430" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="120" y="230" class="label">Inside | داخلي</text><rect x="135" y="300" width="250" height="160" rx="14" fill="#fff" stroke="#818cf8" stroke-width="2"/><text x="173" y="348" class="label">Application server</text><text x="173" y="388" class="ip">10.10.20.50</text><text x="173" y="423" class="small">inside local</text>
  <rect x="525" y="185" width="350" height="430" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="565" y="230" class="label">NAT policy | سياسة NAT</text><rect x="565" y="300" width="270" height="160" rx="12" fill="#fff" stroke="#a78bfa" stroke-width="2"/><text x="600" y="342" class="small">Permanent translation</text><text x="600" y="382" class="ip">10.10.20.50</text><text x="680" y="382" class="small">↔</text><text x="600" y="420" class="ip">203.0.113.50</text>
  <rect x="965" y="185" width="350" height="430" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1005" y="230" class="label">Outside | خارجي</text><rect x="1015" y="300" width="250" height="160" rx="14" fill="#fff" stroke="#34d399" stroke-width="2"/><text x="1055" y="348" class="label">Internet client</text><text x="1055" y="388" class="ip">198.51.100.25</text><text x="1055" y="423" class="small">connects to 203.0.113.50</text>
  <path d="M1015 340 H835" class="arrow" marker-end="url(#a)"/><text x="840" y="320" class="small">Inbound destination: 203.0.113.50</text><path d="M565 420 H385" class="arrow" marker-end="url(#a)"/><text x="395" y="450" class="small">Translated to 10.10.20.50</text>
  <rect x="115" y="680" width="1170" height="82" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="150" y="718" class="label">Use case:</text><text x="280" y="718" class="small">inbound-published service with stable public address. Pair NAT with a restrictive outside ACL/firewall policy.</text><text x="150" y="746" class="small">Static NAT alone does not permit traffic; it only performs translation.</text>
</svg>
