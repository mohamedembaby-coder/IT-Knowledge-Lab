<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">NAT overview: inside local, inside global, outside global, and outside local</title>
  <desc id="desc">An enterprise client sends traffic through a NAT gateway to a public web server. Address terminology is shown on both sides.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#536078}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#40506b}.ip{font-family:Consolas,monospace;font-size:17px;font-weight:700}.box{stroke-width:2}.arrow{stroke:#2563eb;stroke-width:5;fill:none}.return{stroke:#0f766e;stroke-width:5;fill:none;stroke-dasharray:10 8}</style><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#2563eb"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#0f766e"/></marker></defs>
  <rect width="1400" height="820" fill="#f8fafc"/><text x="70" y="70" class="title">NAT Overview | نظرة عامة على NAT</text><text x="70" y="104" class="sub">Network Address Translation rewrites addressing at the enterprise edge while preserving a translation state entry.</text>
  <rect x="70" y="165" width="365" height="470" rx="20" fill="#e0f2fe" stroke="#0284c7" class="box"/><text x="100" y="210" class="label">Inside network | الشبكة الداخلية</text>
  <rect x="130" y="285" width="240" height="150" rx="14" fill="#fff" stroke="#38bdf8" class="box"/><text x="160" y="330" class="label">Client PC</text><text x="160" y="365" class="ip">10.10.10.25</text><text x="160" y="400" class="small">Inside local address</text>
  <text x="118" y="515" class="small">RFC 1918 address: routable only inside</text><text x="118" y="542" class="small">the enterprise / private domain.</text>
  <rect x="520" y="165" width="365" height="470" rx="20" fill="#eff6ff" stroke="#2563eb" class="box"/><text x="555" y="210" class="label">NAT edge | بوابة NAT</text>
  <rect x="570" y="285" width="265" height="150" rx="14" fill="#fff" stroke="#2563eb" class="box"/><text x="605" y="330" class="label">Router / Firewall</text><text x="605" y="365" class="ip">203.0.113.10</text><text x="605" y="400" class="small">Inside global address</text>
  <rect x="555" y="485" width="295" height="98" rx="10" fill="#dbeafe" stroke="#60a5fa"/><text x="580" y="522" class="small">Translation state maps:</text><text x="580" y="552" class="ip">10.10.10.25 ↔ 203.0.113.10</text>
  <rect x="965" y="165" width="365" height="470" rx="20" fill="#ecfdf5" stroke="#059669" class="box"/><text x="995" y="210" class="label">Outside network | الإنترنت</text>
  <rect x="1025" y="285" width="240" height="150" rx="14" fill="#fff" stroke="#34d399" class="box"/><text x="1060" y="330" class="label">Web server</text><text x="1060" y="365" class="ip">198.51.100.80</text><text x="1060" y="400" class="small">Outside global address</text>
  <text x="1005" y="515" class="small">Outside local is normally identical</text><text x="1005" y="542" class="small">to outside global in modern networks.</text>
  <path d="M370 350 H570" class="arrow" marker-end="url(#blue)"/><text x="403" y="326" class="small">source translated</text><path d="M1025 390 H835" class="return" marker-end="url(#green)"/><text x="857" y="421" class="small">return traffic matched to state</text>
  <rect x="120" y="690" width="1160" height="70" rx="12" fill="#fff7ed" stroke="#fb923c" class="box"/><text x="150" y="732" class="label">Key idea:</text><text x="280" y="732" class="small">NAT changes address information; routing, ACLs, DNS, and return-path state must still be correct.</text>
</svg>
