<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">PAT overload translating many hosts to one public IP using ports</title><desc id="desc">Three inside hosts share one public IP. Different source ports distinguish each translation entry.</desc>
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#536078}.label{font-size:19px;font-weight:700}.small{font-size:15px;fill:#42526b}.ip{font-family:Consolas,monospace;font-size:16px;font-weight:700}.line{stroke:#db2777;stroke-width:4;fill:none}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#db2777"/></marker></defs>
  <rect width="1400" height="820" fill="#fdf2f8"/><text x="70" y="70" class="title">PAT (NAT Overload) | ترجمة العناوين مع المنافذ</text><text x="70" y="105" class="sub">Many inside hosts share one public address. The NAT table differentiates flows by protocol and Layer-4 ports.</text>
  <rect x="65" y="160" width="355" height="520" rx="20" fill="#fff" stroke="#ec4899" stroke-width="2"/><text x="100" y="205" class="label">Inside clients</text>
  <g fill="#fdf2f8" stroke="#f472b6" stroke-width="2"><rect x="110" y="265" width="270" height="82" rx="10"/><rect x="110" y="390" width="270" height="82" rx="10"/><rect x="110" y="515" width="270" height="82" rx="10"/></g><text x="135" y="305" class="ip">10.10.10.21:49152</text><text x="135" y="430" class="ip">10.10.10.22:49153</text><text x="135" y="555" class="ip">10.10.10.23:49154</text>
  <rect x="500" y="160" width="480" height="520" rx="20" fill="#fff" stroke="#db2777" stroke-width="2"/><text x="535" y="205" class="label">PAT translation table</text><rect x="535" y="245" width="410" height="290" rx="12" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/><text x="565" y="290" class="small">Inside local TCP source</text><text x="780" y="290" class="small">Inside global</text><line x1="560" y1="310" x2="920" y2="310" stroke="#f9a8d4"/><text x="565" y="355" class="ip">10.10.10.21:49152</text><text x="780" y="355" class="ip">203.0.113.10:30001</text><text x="565" y="415" class="ip">10.10.10.22:49153</text><text x="780" y="415" class="ip">203.0.113.10:30002</text><text x="565" y="475" class="ip">10.10.10.23:49154</text><text x="780" y="475" class="ip">203.0.113.10:30003</text><text x="550" y="600" class="small">Overload conserves public IPv4 addresses.</text><text x="550" y="628" class="small">It still has port, protocol, and state capacity limits.</text>
  <rect x="1060" y="160" width="275" height="520" rx="20" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="1090" y="205" class="label">Internet</text><rect x="1095" y="365" width="205" height="110" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="1130" y="408" class="label">Web service</text><text x="1130" y="440" class="ip">198.51.100.80:443</text>
  <path d="M380 305 H535" class="line" marker-end="url(#a)"/><path d="M380 430 H535" class="line" marker-end="url(#a)"/><path d="M380 555 H535" class="line" marker-end="url(#a)"/><path d="M945 400 H1095" class="line" marker-end="url(#a)"/>
  <rect x="100" y="725" width="1200" height="48" rx="12" fill="#fff" stroke="#f9a8d4" stroke-width="2"/><text x="130" y="755" class="small">Return traffic to 203.0.113.10:30002 is translated back only to the matching inside flow: 10.10.10.22:49153.</text>
</svg>
